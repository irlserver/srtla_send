name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the previous run's result irrelevant.
# Runs on main are kept so every merged commit has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Every job builds with the toolchain pinned in rust-toolchain.toml unless it
# names another one with `cargo +<toolchain>`. The lint and test commands are
# the cargo aliases in .cargo/config.toml, so a local `cargo xlint` / `cargo
# xtest` gives the same answer as CI.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Nightly only for rustfmt: rustfmt.toml uses unstable options.
      - name: Install toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain install nightly --profile minimal --component rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo +nightly fmt --all -- --check

      - name: Clippy
        run: cargo xlint

      - name: Spell check
        run: |
          pipx install codespell==2.4.3
          codespell

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # srtla_send's dev-dependency turns on srtla-core's test-internals feature
      # in every workspace test build, so a test run cannot see the pub(crate)
      # side of the visibility swaps. Library and binary targets do not pull in
      # dev-dependencies, so checking only those builds every crate with
      # test-internals off, on every OS in the matrix.
      - name: Check libraries and binaries without test-internals
        run: cargo check --workspace --lib --bins --locked

      # The integration tests in tests/ link the srtla_send library without its
      # own test-internals feature unless it is asked for. This proves they do
      # not depend on it, without running the suite a second time.
      - name: Check all targets with default features
        run: cargo check --workspace --all-targets --locked

      - name: Test (all features)
        run: cargo xtest --locked

  # The netns suite is the only end-to-end coverage: the real binary against a
  # real srtla_rec over several namespaced links. It needs root (passwordless
  # sudo on the runner), sch_netem, srtla_rec and srt-live-transmit, built here
  # from the irlserver forks the maintainer tests against. NETNS_REQUIRED=1
  # turns a missing dependency into a failure instead of a green skip.
  netns:
    name: Netns integration (Linux)
    runs-on: ubuntu-latest
    # A hung namespace process must not hold a runner for the 6 h default.
    timeout-minutes: 30
    # Remove once the job has been green on main for two weeks.
    continue-on-error: true
    env:
      SRT_REF: 164d51bb24e258285d1a99c881b55af7e9a94894
      SRTLA_REF: 877dc16e36d3fef421f9cffd345b54a526020732
    steps:
      - uses: actions/checkout@v7

      - name: Install build and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev pkg-config iproute2

      - name: Load sch_netem
        run: |
          sudo modprobe sch_netem || {
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
          lsmod | grep sch_netem

      # restore and save are split so the build is cached even while the test
      # step still fails (actions/cache saves only on job success).
      - name: Restore receiver-side binaries
        id: rx-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/rx-root
          key: netns-rx-${{ runner.os }}-${{ env.SRT_REF }}-${{ env.SRTLA_REF }}

      - name: Build libsrt and srt-live-transmit (irlserver/srt)
        if: steps.rx-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          git init srt && cd srt
          git remote add origin https://github.com/irlserver/srt.git
          git fetch --depth 1 origin "$SRT_REF"
          git checkout FETCH_HEAD
          cmake -DCMAKE_INSTALL_PREFIX=/usr .
          make -j"$(nproc)"
          make DESTDIR="$RUNNER_TEMP/rx-root" install

      - name: Build srtla_rec (irlserver/srtla)
        if: steps.rx-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          git init srtla && cd srtla
          git remote add origin https://github.com/irlserver/srtla.git
          git fetch --depth 1 origin "$SRTLA_REF"
          git checkout FETCH_HEAD
          git submodule update --init --depth 1
          cmake -B build .
          cmake --build build -j"$(nproc)"
          install -D -m 0755 build/srtla_rec "$RUNNER_TEMP/rx-root/usr/local/bin/srtla_rec"

      - name: Save receiver-side binaries
        if: steps.rx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/rx-root
          key: ${{ steps.rx-cache.outputs.cache-primary-key }}

      - name: Install receiver-side binaries
        run: |
          sudo cp -a "$RUNNER_TEMP/rx-root/." /
          sudo ldconfig
          command -v srtla_rec
          command -v srt-live-transmit
          pkg-config --modversion srt

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Netns tests
        env:
          NETNS_REQUIRED: "1"
        run: cargo test --locked --no-fail-fast --test 'netns_*' -- --test-threads=1

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read from Cargo.toml so the declared rust-version is the one enforced.
      - name: Install the MSRV toolchain
        run: |
          msrv="$(sed -nE 's/^rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          echo "MSRV=${msrv}" >>"${GITHUB_ENV}"
          rustup toolchain install "${msrv}" --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check
        run: cargo +"${MSRV}" check --workspace --all-targets --all-features --locked

  beta:
    name: Test (Rust beta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install beta
        run: rustup toolchain install beta --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo +beta test --workspace --all-features --locked

  # Miri lane over the only unsafe FFI in the tree: the recvmmsg batch-receive
  # path in src/net/batch_recv.rs. Miri interprets the pure pointer logic
  # (self-referential iovec/mmsghdr setup, msg_len -> MTU clamp, sockaddr_storage
  # decode) and fails the PR on any UB regression there. Hard limit: miri cannot
  # execute the real recvmmsg syscall, so the live-syscall path is not covered.
  # The `batch_recv` filter scopes the run to that module's pure tests; the
  # mimalloc test allocator is cfg'd out under miri (C FFI miri cannot run).
  miri:
    name: Miri (batch_recv unsafe pointer logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly with miri
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src

      - name: Run batch_recv tests under miri
        run: cargo +nightly miri test --lib batch_recv

  # cargo-deny's advisories check reads the same RustSec database as
  # cargo-audit, so it replaces it, and it honors the ignores in deny.toml.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny

      - name: Advisories and sources
        run: cargo deny check advisories sources
