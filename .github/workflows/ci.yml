name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the previous run's result irrelevant.
# Runs on main are kept so every merged commit has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Every job builds with the toolchain pinned in rust-toolchain.toml unless it
# names another one with `cargo +<toolchain>`. The lint and test commands are
# the cargo aliases in .cargo/config.toml, so a local `cargo xlint` / `cargo
# xtest` gives the same answer as CI.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Nightly only for rustfmt: rustfmt.toml uses unstable options.
      - name: Install toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain install nightly --profile minimal --component rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo +nightly fmt --all -- --check

      - name: Clippy
        run: cargo xlint

      - name: Spell check
        run: |
          pipx install codespell==2.4.3
          codespell

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Default features first: the test-internals feature widens visibility,
      # so this run proves the tests do not lean on it by accident.
      - name: Test (default features)
        run: cargo test --workspace --locked

      - name: Test (all features)
        run: cargo xtest --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read from Cargo.toml so the declared rust-version is the one enforced.
      - name: Install the MSRV toolchain
        run: |
          msrv="$(sed -nE 's/^rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          echo "MSRV=${msrv}" >>"${GITHUB_ENV}"
          rustup toolchain install "${msrv}" --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo +"${MSRV}" check --workspace --all-targets --all-features --locked

  beta:
    name: Test (Rust beta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install beta
        run: rustup toolchain install beta --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo +beta test --workspace --all-features --locked

  # Miri lane over the only unsafe FFI in the tree: the recvmmsg batch-receive
  # path in src/connection/batch_recv.rs. Miri interprets the pure pointer logic
  # (self-referential iovec/mmsghdr setup, msg_len -> MTU clamp, sockaddr_storage
  # decode) and fails the PR on any UB regression there. Hard limit: miri cannot
  # execute the real recvmmsg syscall, so the live-syscall path is not covered.
  # The `batch_recv` filter scopes the run to that module's pure tests; the
  # mimalloc test allocator is cfg'd out under miri (C FFI miri cannot run).
  miri:
    name: Miri (batch_recv unsafe pointer logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly with miri
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src

      - name: Run batch_recv tests under miri
        run: cargo +nightly miri test --lib batch_recv

  # cargo-deny's advisories check reads the same RustSec database as
  # cargo-audit, so it replaces it, and it honors the ignores in deny.toml.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Advisories and sources
        run: cargo deny check advisories sources
