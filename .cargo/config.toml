# Cargo configuration for srtla_send testing

[build]
# Enable all features during testing
rustflags = ["-D", "warnings"]  # Treat warnings as errors during CI

[test]
# Run tests with full backtrace on failure
env = { RUST_BACKTRACE = "full", RUST_LOG = "debug" }

# The exact lint and test invocations CI runs, so a local pass means a CI pass.
# --workspace matters: the root is also a package, so a bare `cargo test` or
# `cargo clippy` covers srtla_send alone and skips the crates/ members.
[alias]
xlint = "clippy --workspace --all-targets --all-features -- -D warnings"
xtest = "test --workspace --all-features"

[profile.test]
# Optimize tests for debugging
debug = true
overflow-checks = true