# Cargo configuration for the srtla_send workspace

[build]
# Every build in this repo treats warnings as errors: local builds and every CI
# lane (including the MSRV check, beta tests and the release .deb build), not
# only clippy. A RUSTFLAGS environment variable replaces this list.
rustflags = ["-D", "warnings"]

# The exact lint and test invocations CI runs, so a local pass means a CI pass.
# --workspace matters: the root is also a package, so a bare `cargo test` or
# `cargo clippy` covers srtla_send alone and skips the crates/ members.
[alias]
xlint = "clippy --workspace --all-targets --all-features -- -D warnings"
xtest = "test --workspace --all-features"

[profile.test]
# Optimize tests for debugging
debug = true
overflow-checks = true