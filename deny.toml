# Cargo-deny configuration for srtla_send.
# Enforces supply-chain security: advisories and source integrity.
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
yanked = "deny"

[sources]
# Enforce crate source integrity.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
